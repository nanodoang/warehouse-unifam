<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Report Muat Gudang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: header filter periode → strip ringkasan → tab Tim/Shift/Tanggal/Minggu → tabel rekap dengan rincian per baris */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#15201b; --muted:#5a6a62; --line:#d5ddd9; --soft:#f4f7f5;
  --accent:#0d6b4d; --accent-ink:#ffffff; --bar:#7fb8a1;
  --good:#0d6b4d; --good-bg:#d9f0e5; --warn:#7a5c00; --warn-bg:#fff1c2; --bad:#b42318; --bad-bg:#fde5e2;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18211d; --ink:#e4ece8; --muted:#97a8a0; --line:#2c3833; --soft:#1d2723;
  --accent:#3fbf8f; --accent-ink:#06150f; --bar:#2f7d60;
  --good:#5fd3a6; --good-bg:#123527; --warn:#f1c84b; --warn-bg:#3a3010; --bad:#ff8a7a; --bad-bg:#3d1a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18211d; --ink:#e4ece8; --muted:#97a8a0; --line:#2c3833; --soft:#1d2723;
  --accent:#3fbf8f; --accent-ink:#06150f; --bar:#2f7d60;
  --good:#5fd3a6; --good-bg:#123527; --warn:#f1c84b; --warn-bg:#3a3010; --bad:#ff8a7a; --bad-bg:#3d1a16; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.title h1{margin:0;font-size:20px;font-weight:700}
.title small{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.controls label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:12px;color:var(--muted)}
.demo{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 10px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi b{font:600 22px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}

.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto}
.tab{border:0;background:none;border-radius:7px;padding:7px 14px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.actions{display:flex;gap:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft);cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1}
th:first-child{background:var(--soft)}
th.nosort{cursor:default}
th[aria-sort="ascending"]::after{content:" ▲"} th[aria-sort="descending"]::after{content:" ▼"}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--surface)}
td.txt{font-family:var(--font);text-align:left;white-space:normal;min-width:160px}
tr.grp{cursor:pointer}
tr.grp:hover td{background:var(--soft)}
tr.grp td:first-child,tr.total td:first-child{font-family:var(--font);font-weight:600;white-space:nowrap}
tr.grp td:first-child::before{content:"▸ ";color:var(--muted)}
tr.grp.open td:first-child::before{content:"▾ "}
tr.total td{font-weight:600;background:var(--soft);border-top:2px solid var(--line)}
tr.total td:first-child::before{content:none}
.cnt{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cnt .track{width:70px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;flex:0 0 70px}
.cnt .fill{display:block;height:100%;background:var(--bar);border-radius:0 3px 3px 0}
.pct{display:inline-block;min-width:52px;text-align:center;padding:2px 6px;border-radius:999px;font-weight:600;font-size:12px}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-na{color:var(--muted)}
.sub{color:var(--muted);font-size:12px}
.detail td{background:var(--soft);padding:0}
.detail .inner{padding:8px 10px 12px;overflow-x:auto}
.detail table{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.detail th,.detail td{position:static;text-align:left;padding:6px 8px;cursor:default}
.detail th{background:var(--surface)}
.detail td{background:var(--surface)}
.detail .n{text-align:right}
.detail td.txt{min-width:150px}
.hm{font-weight:600} .hm.Hit{color:var(--good)} .hm.Miss{color:var(--bad)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30}
@media (max-width:640px){.kpi b{font-size:18px}.kpi:last-child:nth-child(odd){grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title"><small>Admin · DMS- · PT. UNIFAM</small><h1>Report Muat Gudang</h1></div>
    <div class="controls">
      <div class="presets" id="presets" role="group" aria-label="Periode cepat"></div>
      <label>Dari<input type="date" id="fDari"></label>
      <label>Sampai<input type="date" id="fSampai"></label>
      <button class="btn primary" id="btnLoad" type="button">Tampilkan</button>
    </div>
  </header>
  <div class="demo" id="demoNote" hidden>Mode contoh: data muat asli tab DMS- dari file export (7 Sep – 9 Okt 2026), belum terhubung ke sheet.</div>
  <div class="status" id="status"></div>

  <section class="kpis" id="kpis" aria-label="Ringkasan periode"></section>

  <div class="bar-row">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-v="tim" aria-selected="true">Per Tim</button>
      <button class="tab" role="tab" data-v="shift" aria-selected="false">Per Shift</button>
      <button class="tab" role="tab" data-v="tanggal" aria-selected="false">Per Tanggal</button>
      <button class="tab" role="tab" data-v="minggu" aria-selected="false">Per Minggu</button>
    </div>
    <div class="actions">
      <button class="btn" id="btnCopy" type="button">Salin ke Excel</button>
      <button class="btn" id="btnCsv" type="button">Unduh CSV</button>
    </div>
  </div>

  <section class="card">
    <div class="tbl-wrap" id="tblWrap"></div>
    <div class="legend">
      <span>Ketuk baris untuk lihat rincian truk.</span>
      <span><b>Cycle</b> = kolom AS · <b>Target</b> = kolom AY · <b>Durasi muat</b> = AR · <b>Total jam</b> = AW</span>
      <span>Persen Hit: <span class="pct p-good">≥ 80%</span> <span class="pct p-warn">50–79%</span> <span class="pct p-bad">&lt; 50%</span></span>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

/* ====== UTIL ====== */
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN=(n,dec=0)=>n==null||isNaN(n)?'–':n.toLocaleString('id-ID',{maximumFractionDigits:dec,minimumFractionDigits:dec});
const hm=m=>{if(m==null||isNaN(m))return '–';m=Math.round(m);return Math.floor(m/60)+':'+p2(m%60);};
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const tglPendek=s=>{const d=new Date(s+'T00:00:00');return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()];};
const jam=s=>s?s.slice(11,16):'–';
function isoWeek(s){const d=new Date(s+'T00:00:00');const t=new Date(d);t.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return {y:t.getFullYear(),w:1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7)};}
function senin(s){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);}
const normShift=s=>{const m=String(s||'').match(/(\d)/);return m?'Shift '+m[1]:'(tanpa shift)';};
const normTim=s=>{const m=String(s||'').match(/^\s*tim\s*(\d+)/i);return m?'Tim '+(+m[1]):'(tanpa tim)';};
const natCmp=(a,b)=>String(a).localeCompare(String(b),'id',{numeric:true});

/* ====== DATA ====== */
let recs=[], view='tim', sortKey=null, sortDir=1, openKey=null, lastRows=[], lastCols=[];

function toRec(a){
  return {per:a[0],shift:normShift(a[1]),tim:normTim(a[2]),dist:a[3],exp:a[4],truck:a[5],qty:a[6],m3:a[7],
    masuk:a[8],muat:a[9],selesai:a[10],keluar:a[11],dur:a[12],tot:a[13],std:a[14],
    cyc:a[15]==='Hit'||a[15]==='Miss'?a[15]:'',tgt:a[16]==='Hit'||a[16]==='Miss'?a[16]:'',dt:a[17]||[],issue:a[18]||''};
}
async function load(fresh){
  const dari=$('#fDari').value, sampai=$('#fSampai').value;
  if(!dari||!sampai||dari>sampai){$('#status').textContent='Isi tanggal dari dan sampai dengan benar.';return;}
  $('#btnLoad').disabled=true; $('#status').textContent='Mengambil data…';
  try{
    let data;
    if(DEMO){ data=DEMO_DATA.filter(a=>a[0]>=dari&&a[0]<=sampai); }
    else{
      const r=await fetch(GAS_URL+'?action=getReport&dari='+dari+'&sampai='+sampai+(fresh?'&fresh=1':''));
      const j=await r.json(); if(!j.ok) throw new Error(j.msg); data=j.data;
    }
    recs=data.map(toRec); openKey=null;
    $('#status').textContent=recs.length+' truk dimuat · '+tglPendek(dari)+' – '+tglPendek(sampai)+' '+sampai.slice(0,4);
    render();
  }catch(e){ $('#status').textContent='Gagal mengambil data: '+e.message+'. Coba Tampilkan lagi.'; }
  finally{ $('#btnLoad').disabled=false; }
}

/* ====== AGREGASI ====== */
const avg=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
const sum=a=>a.reduce((s,x)=>s+(Number(x)||0),0);
function pctHit(list,k){const h=list.filter(r=>r[k]==='Hit').length,m=list.filter(r=>r[k]==='Miss').length;return h+m?h/(h+m)*100:null;}
function stats(list){
  const dtTot=DT_NAMES.map((_,i)=>sum(list.map(r=>r.dt[i])));
  const topI=dtTot.reduce((b,v,i)=>v>dtTot[b]?i:b,0);
  const hari=new Set(list.map(r=>r.per)).size;
  return {
    n:list.length, qty:sum(list.map(r=>r.qty)), m3:sum(list.map(r=>r.m3)),
    dur:avg(list.map(r=>r.dur).filter(x=>x!=null&&x<=24*60)), tot:avg(list.map(r=>r.tot).filter(x=>x!=null&&x<=48*60)),
    cyc:pctHit(list,'cyc'), tgt:pctHit(list,'tgt'), dt:sum(dtTot), top:dtTot[topI]?DT_NAMES[topI]:'',
    hari, perHari:hari?list.length/hari:null,
    s1:list.filter(r=>r.shift==='Shift 1').length, s2:list.filter(r=>r.shift==='Shift 2').length, s3:list.filter(r=>r.shift==='Shift 3').length
  };
}
const VIEWS={
  tim:{key:r=>r.tim,label:k=>k,sort:natCmp},
  shift:{key:r=>r.shift,label:k=>k+({'Shift 1':' · 05–13','Shift 2':' · 13–21','Shift 3':' · 21–05'}[k]||''),sort:natCmp},
  tanggal:{key:r=>r.per,label:k=>tglPendek(k),sort:(a,b)=>a<b?-1:a>b?1:0},
  minggu:{key:r=>senin(r.per),label:k=>{const w=isoWeek(k),e=addDays(k,6),d1=new Date(k+'T00:00:00'),d2=new Date(e+'T00:00:00');return 'W'+w.w+' · '+d1.getDate()+' '+BLN[d1.getMonth()]+' – '+d2.getDate()+' '+BLN[d2.getMonth()];},sort:(a,b)=>a<b?-1:a>b?1:0}
};
function columns(){
  const c=[
    {k:'label',t:'',cls:'txt'},
    {k:'n',t:'Truk'},
    {k:'qty',t:'Qty muat',f:v=>fmtN(v)},
    {k:'m3',t:'M3',f:v=>fmtN(v,1)}
  ];
  if(view==='tanggal'||view==='minggu') c.push({k:'s1',t:'S1'},{k:'s2',t:'S2'},{k:'s3',t:'S3'});
  if(view==='tim'||view==='shift'||view==='minggu') c.push({k:'perHari',t:'Truk/hari',f:v=>fmtN(v,1)});
  c.push(
    {k:'dur',t:'Rata muat',f:hm},
    {k:'cyc',t:'Cycle hit',pct:1},
    {k:'tot',t:'Rata total jam',f:hm},
    {k:'tgt',t:'Target hit',pct:1},
    {k:'dt',t:'Downtime',f:v=>v?hm(v):'–'},
    {k:'top',t:'Kendala utama',cls:'txt',f:v=>v||'–'}
  );
  return c;
}
const pctHTML=v=>v==null?'<span class="pct p-na">–</span>':`<span class="pct ${v>=HIT_BAIK?'p-good':v>=HIT_CUKUP?'p-warn':'p-bad'}">${Math.round(v)}%</span>`;

/* ====== RENDER ====== */
function render(){
  renderKpi();
  if(!recs.length){$('#tblWrap').innerHTML='<div class="empty">Belum ada data muat di periode ini. Data masuk setelah petugas mengisi Jam Muat.</div>';lastRows=[];return;}
  const V=VIEWS[view], g={};
  recs.forEach(r=>{(g[V.key(r)]=g[V.key(r)]||[]).push(r);});
  let rows=Object.keys(g).map(k=>Object.assign({key:k,label:V.label(k),list:g[k]},stats(g[k])));
  if(sortKey&&sortKey!=='label') rows.sort((a,b)=>((a[sortKey]??-1)>(b[sortKey]??-1)?1:(a[sortKey]??-1)<(b[sortKey]??-1)?-1:0)*sortDir);
  else rows.sort((a,b)=>V.sort(a.key,b.key)*(sortKey==='label'?sortDir:1));
  const cols=columns(), maxN=Math.max(...rows.map(r=>r.n)), tot=Object.assign({label:'Total'},stats(recs));
  lastRows=rows.concat([tot]); lastCols=cols;
  const cell=(r,c,isTot)=>{
    const v=r[c.k];
    if(c.k==='n'&&!isTot) return `<td><div class="cnt">${v}<span class="track"><span class="fill" style="width:${(v/maxN*100).toFixed(1)}%"></span></span></div></td>`;
    if(c.pct) return `<td>${pctHTML(v)}</td>`;
    return `<td class="${c.cls||''}">${esc(c.f?c.f(v):v)}</td>`;
  };
  $('#tblWrap').innerHTML=`<table><thead><tr>${cols.map(c=>`<th data-k="${c.k}" ${sortKey===c.k?`aria-sort="${sortDir>0?'ascending':'descending'}"`:''}>${c.t||{tim:'Tim',shift:'Shift',tanggal:'Tanggal',minggu:'Minggu'}[view]}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr class="grp ${openKey===r.key?'open':''}" data-key="${esc(r.key)}">${cols.map(c=>cell(r,c)).join('')}</tr>${openKey===r.key?detailHTML(r.list,cols.length):''}`).join('')}
  <tr class="total">${cols.map(c=>cell(tot,c,true)).join('')}</tr></tbody></table>`;
}
function renderKpi(){
  const s=stats(recs);
  const k=[
    ['Truk dimuat',fmtN(s.n),s.perHari?fmtN(s.perHari,1)+' per hari':''],
    ['Qty muat',fmtN(s.qty),''],
    ['Volume',fmtN(s.m3,0),'m³'],
    ['Rata durasi muat',hm(s.dur),'jam:menit'],
    ['Cycle hit',s.cyc==null?'–':Math.round(s.cyc)+'%','kolom AS'],
    ['Target hit',s.tgt==null?'–':Math.round(s.tgt)+'%','kolom AY'],
    ['Downtime',s.dt?hm(s.dt):'–',s.top||'']
  ];
  $('#kpis').innerHTML=k.map(([a,b,c])=>`<div class="kpi"><span>${a}</span><b>${b}</b><i>${esc(c)}</i></div>`).join('');
}
function detailHTML(list,span){
  const l=list.slice().sort((a,b)=>a.muat<b.muat?-1:1);
  const H=[['Tanggal'],['Shift'],['Tim'],['Distributor'],['Expedisi · Truck'],['Qty','n'],['Masuk','n'],['Muat','n'],['Selesai','n'],['Durasi','n'],['Cycle'],['Total jam','n'],['Target'],['Issue']];
  return `<tr class="detail"><td colspan="${span}"><div class="inner"><table><thead><tr>${H.map(([t,c])=>`<th class="nosort ${c||''}">${t}</th>`).join('')}</tr></thead><tbody>
    ${l.map(r=>`<tr><td>${tglPendek(r.per)}</td><td>${esc(r.shift.replace('Shift ','S'))}</td><td>${esc(r.tim)}</td><td class="txt">${esc(r.dist)}</td><td class="txt">${esc([r.exp,r.truck].filter(Boolean).join(' · ')||'–')}</td>
      <td class="n">${fmtN(r.qty)}</td><td class="n">${jam(r.masuk)}</td><td class="n">${jam(r.muat)}</td><td class="n">${jam(r.selesai)}</td><td class="n">${hm(r.dur)}</td>
      <td class="hm ${r.cyc}">${r.cyc||'–'}</td><td class="n">${hm(r.tot)}</td><td class="hm ${r.tgt}">${r.tgt||'–'}</td><td class="txt">${esc(r.issue)}</td></tr>`).join('')}
    </tbody></table></div></td></tr>`;
}

/* ====== EXPORT ====== */
function tableText(sep){
  const head=lastCols.map(c=>c.t||{tim:'Tim',shift:'Shift',tanggal:'Tanggal',minggu:'Minggu'}[view]);
  const body=lastRows.map(r=>lastCols.map(c=>{const v=r[c.k];if(c.pct)return v==null?'':Math.round(v)+'%';return c.f?c.f(v):(v??'');}));
  const q=s=>sep===','&&/[",\n]/.test(String(s))?'"'+String(s).replace(/"/g,'""')+'"':String(s);
  return [head,...body].map(r=>r.map(q).join(sep)).join('\n');
}
$('#btnCopy').onclick=()=>{
  if(!lastRows.length) return toast('Belum ada data.');
  navigator.clipboard.writeText(tableText('\t')).then(()=>toast('Tabel disalin. Paste di Excel atau Sheets.')).catch(()=>toast('Browser menolak salin. Pakai Unduh CSV.'));
};
$('#btnCsv').onclick=()=>{
  if(!lastRows.length) return toast('Belum ada data.');
  const b=new Blob(['﻿'+tableText(',')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`report-muat-${view}-${$('#fDari').value}_${$('#fSampai').value}.csv`;a.click();
};

/* ====== PERIODE CEPAT ====== */
const today=ymd(new Date());
const PRESETS=[
  ['minggu','Minggu ini',()=>[senin(today),addDays(senin(today),6)]],
  ['lalu','Minggu lalu',()=>[addDays(senin(today),-7),addDays(senin(today),-1)]],
  ['4m','4 minggu',()=>[addDays(senin(today),-21),addDays(senin(today),6)]],
  ['bulan','Bulan ini',()=>[today.slice(0,8)+'01',today]]
];
let preset='4m';
function renderPresets(){$('#presets').innerHTML=PRESETS.map(([k,l])=>`<button type="button" class="chip" data-p="${k}" aria-pressed="${preset===k}">${l}</button>`).join('');}
function applyPreset(k){preset=k;const[a,b]=PRESETS.find(p=>p[0]===k)[2]();$('#fDari').value=a;$('#fSampai').value=b;renderPresets();load();}

/* ====== EVENTS ====== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,th,tr.grp'); if(!t) return;
  if(t.dataset.p) applyPreset(t.dataset.p);
  else if(t.matches('.tab')){view=t.dataset.v;sortKey=null;openKey=null;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));render();}
  else if(t.matches('th[data-k]')){const k=t.dataset.k;sortDir=sortKey===k?-sortDir:(k==='label'?1:-1);sortKey=k;render();}
  else if(t.matches('tr.grp')){openKey=openKey===t.dataset.key?null:t.dataset.key;render();}
  else if(t.id==='btnLoad'){preset='';renderPresets();load(true);}
});
['fDari','fSampai'].forEach(id=>$('#'+id).addEventListener('change',()=>{preset='';renderPresets();}));

$('#demoNote').hidden=!DEMO;
applyPreset(preset);
</script>
